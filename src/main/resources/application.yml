server:
  port: ${PORT:8080}                       # o Render informa a porta em PORT
  forward-headers-strategy: framework      # atrás do proxy https da hospedagem

management:
  endpoints:
    web:
      exposure:
        include: health                    # só o health; o resto do actuator fica fechado
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: menu-win-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/menuwin}
    username: ${DB_USER:menuwin}
    password: ${DB_PASSWORD:menuwin}
  mvc:
    problemdetails:
      enabled: true              # erros em JSON (RFC 9457) com a mensagem em "detail"
  jpa:
    open-in-view: false          # sessão só existe dentro de @Transactional (essencial p/ o tenant)
    hibernate:
      ddl-auto: validate         # quem cria tabela é o Flyway; o Hibernate só confere o mapeamento
    properties:
      hibernate.default_batch_fetch_size: 50   # coleções lazy (itens, adicionais) em lote, sem N+1
  flyway:
    locations: classpath:db/migration

menuwin:
  # URL pública da API (https). O Mercado Pago manda os webhooks para cá. Vazio = sem webhook.
  url-publica: ${URL_PUBLICA:}
  cors:
    origens: ${CORS_ORIGENS:}    # origens do frontend separadas por vírgula; vazio = nenhuma
  jwt:
    secret: ${JWT_SECRET}        # obrigatório fora do dev: >= 32 bytes, sem valor padrão de propósito
    expiracao: 8h
  crypto:
    chave: ${CRYPTO_KEY}         # obrigatório fora do dev: 32 bytes em Base64 (AES-256). Trocar = perder as credenciais salvas
  pix:
    expiracao: 30m
    simulado: false              # true = Pix de mentira para homologar (só sobe em dev/test)
  mercadopago:
    api-url: https://api.mercadopago.com

---
# Produção (Render + Supabase). O Dockerfile liga este profile.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}                         # session pooler do Supabase (IPv4, porta 5432), com sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL:5}      # o pooler do plano grátis aceita poucas conexões
      schema: menuwin
  flyway:
    schemas: menuwin                       # schema próprio: o "public" do Supabase fica exposto pela Data API
    default-schema: menuwin
server:
  tomcat:
    threads:
      max: ${TOMCAT_THREADS:50}            # instância pequena; cada thread custa memória (SSE não segura thread)

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev   # inclui dados de exemplo
  jpa:
    show-sql: true
menuwin:
  cors:
    origens: ${CORS_ORIGENS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:dev-somente-local-troque-em-producao-0123456789}
  crypto:
    chave: ${CRYPTO_KEY:ZGV2LXNvbWVudGUtbG9jYWwtY2hhdmUtMzJieXRlcyE=}
  pix:
    simulado: ${PIX_SIMULADO:true}   # PIX_SIMULADO=false para testar no sandbox real do Mercado Pago
